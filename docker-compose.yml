name: kgm

services:
  postgres:
    image: postgres:16-alpine
    container_name: kgm-postgres
    environment:
      POSTGRES_USER: kgm
      POSTGRES_PASSWORD: kgm
      POSTGRES_DB: kgm_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kgm -d kgm_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kgm-redis
    ports:
      - '6379:6379'

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: kgm-meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data

  minio:
    image: minio/minio:latest
    container_name: kgm-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: kgm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: kgm-media
    entrypoint: /bin/sh
    command: /init.sh
    volumes:
      - ./infrastructure/docker/minio-init.sh:/init.sh:ro
    restart: 'no'

volumes:
  pg_data:
  meili_data:
  minio_data:
