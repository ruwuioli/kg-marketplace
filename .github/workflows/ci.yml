name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kgm:kgm@localhost:5432/kgm_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-test-secret
      JWT_REFRESH_SECRET: test-refresh-secret-test-refresh
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kgm-media
      MINIO_PUBLIC_URL: http://localhost:9000/kgm-media
      API_INTERNAL_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @kgm/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
